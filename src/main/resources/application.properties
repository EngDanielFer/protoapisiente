spring.application.name=protoapisiente
 
# Render asigna el puerto via variable de entorno PORT
server.port=${PORT:8000}
 
# Base de datos MySQL Hostinger
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 
# Pool de conexiones - importante en Render (recursos limitados)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
 
# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
 
# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
 
# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
 
# CORS - URL del frontend en Hostinger
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
 
# Logging reducido en produccion
logging.level.com.apisienteproto=WARN
logging.level.org.springframework.security=WARN
logging.level.root=WARN
 
# Actuator - health check para Render
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never